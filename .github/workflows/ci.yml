name: Build INIT40
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Arm GNU 14.2.Rel1
        run: |
          url=https://developer.arm.com/-/media/Files/downloads/gnu/14.2.rel1/binrel
          archive=arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi.tar.xz
          curl -fL --retry 3 "$url/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fL --retry 3 "$url/$archive.sha256asc" -o "$RUNNER_TEMP/toolchain.sha256"
          cd "$RUNNER_TEMP"
          sha256sum --check toolchain.sha256
          tar -xf "$archive"
          echo "$RUNNER_TEMP/${archive%.tar.xz}/bin" >> "$GITHUB_PATH"
      - name: Set up INIT40 dependencies
        run: util/init40/setup.sh
      - name: Clean compile
        run: util/init40/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: init40-vial
          path: |
            init40_init40_vial.bin
            .build/init40_init40_vial.elf
            .build/init40_init40_vial.map
          include-hidden-files: true
          if-no-files-found: error
